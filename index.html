<style>
/* Layout: one-column field instrument. The correction readout dominates the top; inputs sit in grouped
   panels below; a fixed bottom tab bar switches Solve / Table / MPBR / Rifles. Dark-first for low light,
   with a high-contrast light palette for bright sun. */
:root {
  --bg: #0e1113;
  --panel: #161a1d;
  --raise: #1e2327;
  --line: #2a3035;
  --fg: #e7eaec;
  --muted: #8d969d;
  --accent: #ff9a1f;
  --accent-ink: #1b1104;
  --danger: #ff6b5e;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef0ee; --panel: #ffffff; --raise: #f4f5f3; --line: #d5d9d5; --fg: #121619; --muted: #5a636a;
    --accent: #b85700; --accent-ink: #ffffff; --danger: #c0352a; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef0ee; --panel: #ffffff; --raise: #f4f5f3; --line: #d5d9d5; --fg: #121619; --muted: #5a636a;
  --accent: #b85700; --accent-ink: #ffffff; --danger: #c0352a; color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body);
  -webkit-text-size-adjust: 100%;
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(96px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
header.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
header.brand h1 { margin: 0; font: 700 22px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; }
header.brand h1 span { color: var(--accent); }
header.brand small { color: var(--muted); font-size: 12px; }

h2 {
  margin: 6px 0 0; font: 600 11.5px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--accent);
}
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px 14px; }
.row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px;
  border-bottom: 1px solid var(--line);
}
.row:last-child { border-bottom: 0; }
.row label, .row .lbl { flex: 1 1 auto; min-width: 0; }
.row .hint { display: block; color: var(--muted); font-size: 12px; }
.field { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
input[type="text"], select {
  font: 500 16px var(--num); color: var(--fg); background: var(--raise); border: 1px solid var(--line);
  border-radius: 7px; padding: 8px 10px; width: 7.5em; text-align: right;
  font-variant-numeric: tabular-nums;
}
input.wide, select.wide { width: 100%; text-align: left; font-family: var(--body); }
select { text-align: left; font-family: var(--body); width: auto; max-width: 100%; }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.unit { color: var(--muted); font-size: 12px; min-width: 2.6em; }

button {
  font: 600 14px var(--body); color: var(--fg); background: var(--raise); border: 1px solid var(--line);
  border-radius: 7px; padding: 9px 12px; cursor: pointer; touch-action: manipulation;
}
button:active { transform: translateY(1px); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.ghost { background: transparent; }
button.danger { color: var(--danger); }
button.pm { width: 40px; padding: 8px 0; font-family: var(--num); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns > button { flex: 1 1 0; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: 0 0 auto; }
.seg button { border: 0; border-radius: 0; background: var(--raise); color: var(--muted); padding: 8px 11px; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* Readout */
.readout { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; }
.corr { display: grid; grid-template-columns: 4.6em 1fr auto; align-items: baseline; gap: 8px; }
.corr .dir { font: 700 15px var(--display); letter-spacing: .08em; color: var(--muted); }
.corr .val { font: 600 40px/1 var(--num); font-variant-numeric: tabular-nums; }
.corr .val small { font: 500 15px var(--body); color: var(--muted); margin-left: 6px; }
.corr .clk { font: 500 14px var(--num); color: var(--muted); text-align: right; }
.corr.elev .val { color: var(--accent); }
.corr.wind .val { font-size: 30px; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 16px; margin: 4px 0 0; border-top: 1px solid var(--line); padding-top: 10px; }
.facts div { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-family: var(--num); font-variant-numeric: tabular-nums; text-align: right; }
.warn { color: var(--danger); }
.oor { font: 600 20px var(--display); color: var(--danger); }

.stepper { display: grid; grid-template-columns: auto auto 1fr auto auto; gap: 6px; align-items: center; }
.stepper input { width: 100%; font-size: 28px; text-align: center; padding: 6px; }
.stepper .rangewrap { position: relative; }
.stepper .rangewrap span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; pointer-events: none; }

.note { color: var(--muted); font-size: 12.5px; margin: 0; }

/* Table */
.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font: 13.5px var(--num); font-variant-numeric: tabular-nums; }
th, td { padding: 7px 9px; text-align: right; white-space: nowrap; }
th { position: sticky; top: 0; background: var(--raise); color: var(--accent); font: 600 11.5px var(--body); letter-spacing: .06em; text-transform: uppercase; }
tbody tr:nth-child(even) { background: var(--raise); }
tr.trans td { color: var(--muted); }

/* MPBR */
.chart { width: 100%; max-width: 100%; aspect-ratio: 1 / 0.72; display: block; border: 1px solid var(--line); border-radius: 10px; }
.mz { font: 600 30px/1.1 var(--num); color: var(--accent); }
.mp { font: 600 20px/1.2 var(--num); }

/* Rifles */
.rifle { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; }
.rifle.sel { border-color: var(--accent); }
.rifle h3 { margin: 0; font: 600 16px var(--body); display: flex; gap: 8px; align-items: center; }
.rifle h3 .tag { font: 600 10.5px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink); background: var(--accent); border-radius: 4px; padding: 2px 6px; }
.rifle p { margin: 0; color: var(--muted); font-size: 13px; font-family: var(--num); }

/* Tab bar */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--panel); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
}
nav.tabs button { background: transparent; border: 0; color: var(--muted); font: 600 13px var(--display); letter-spacing: .08em; text-transform: uppercase; padding: 12px 4px; }
nav.tabs button[aria-current="page"] { color: var(--accent); box-shadow: inset 0 2px 0 var(--accent); border-radius: 0; }

/* Factory ammo sheet */
.sheet { position: fixed; inset: 0; z-index: 20; background: rgb(0 0 0 / .55); display: flex; align-items: flex-end; justify-content: center; }
.sheet .box {
  background: var(--bg); border: 1px solid var(--line); border-radius: 14px 14px 0 0; width: 100%; max-width: 560px;
  max-height: 88%; display: flex; flex-direction: column; gap: 10px;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sheet .head h2 { margin: 0; }
.sheet .list { overflow-y: auto; display: grid; gap: 6px; -webkit-overflow-scrolling: touch; }
.load { text-align: left; display: grid; gap: 2px; font-weight: 500; }
.load span { color: var(--muted); font: 12.5px var(--num); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="brand"><h1>Traj<span>e</span>cta</h1><small id="ver">Ballistic solver</small></header>
  <main id="main" style="display:flex;flex-direction:column;gap:14px"></main>
</div>
<nav class="tabs" aria-label="Sections">
  <button data-tab="solve">Solve</button>
  <button data-tab="table">Table</button>
  <button data-tab="mpbr">MPBR</button>
  <button data-tab="rifles">Rifles</button>
</nav>
<div id="sheet"></div>

<script>
"use strict";
// ---------- Constants ----------
const FT = 0.3048, YD = 0.9144, FTLB = 0.737562, MIL_TO_MOA = 3.437747, INCH = 0.0254;

// ---------- Drag tables (Mach, Cd) ----------
const G1 = [0,.2629,.05,.2558,.1,.2487,.15,.2413,.2,.2344,.25,.2278,.3,.2214,.35,.2155,.4,.2104,.45,.2061,.5,.2032,.55,.202,.6,.2034,.7,.2165,.725,.223,.75,.2313,.775,.2417,.8,.2546,.825,.2706,.85,.2901,.875,.3136,.9,.3415,.925,.3734,.95,.4084,.975,.4448,1,.4805,1.025,.5136,1.05,.5427,1.075,.5677,1.1,.5883,1.125,.6053,1.15,.6191,1.2,.6393,1.25,.6518,1.3,.6589,1.35,.6621,1.4,.6625,1.45,.6607,1.5,.6573,1.55,.6528,1.6,.6474,1.65,.6413,1.7,.6347,1.75,.628,1.8,.621,1.85,.6141,1.9,.6072,1.95,.6003,2,.5934,2.05,.5867,2.1,.5804,2.15,.5743,2.2,.5685,2.25,.563,2.3,.5577,2.35,.5527,2.4,.5481,2.45,.5438,2.5,.5397,2.6,.5325,2.7,.5264,2.8,.5211,2.9,.5168,3,.5133,3.1,.5105,3.2,.5084,3.3,.5067,3.4,.5054,3.5,.504,3.6,.503,3.7,.5022,3.8,.5016,3.9,.501,4,.5006,4.2,.4998,4.4,.4995,4.6,.4992,4.8,.499,5,.4988];
const G7 = [0,.1198,.05,.1197,.1,.1196,.15,.1194,.2,.1193,.25,.1194,.3,.1194,.35,.1194,.4,.1193,.45,.1193,.5,.1194,.55,.1193,.6,.1194,.65,.1197,.7,.1202,.725,.1207,.75,.1215,.775,.1226,.8,.1242,.825,.1266,.85,.1306,.875,.1368,.9,.1464,.925,.166,.95,.2054,.975,.2993,1,.3803,1.025,.4015,1.05,.4043,1.075,.4034,1.1,.4014,1.125,.3987,1.15,.3955,1.2,.3884,1.25,.381,1.3,.3732,1.35,.3657,1.4,.358,1.5,.344,1.55,.3376,1.6,.3315,1.65,.326,1.7,.3209,1.75,.316,1.8,.3117,1.85,.3078,1.9,.3042,1.95,.301,2,.298,2.05,.2951,2.1,.2922,2.15,.2892,2.2,.2864,2.25,.2835,2.3,.2807,2.35,.2779,2.4,.2752,2.45,.2725,2.5,.2697,2.55,.267,2.6,.2643,2.65,.2615,2.7,.2588,2.75,.2561,2.8,.2533,2.85,.2506,2.9,.2479,2.95,.2451,3,.2424,3.1,.2368,3.2,.2313,3.3,.2258,3.4,.2205,3.5,.2154,3.6,.2106,3.7,.206,3.8,.2017,3.9,.1975,4,.1935,4.2,.1861,4.4,.1793,4.6,.173,4.8,.1672,5,.1618];

function cd(t, m) {
  const n = t.length / 2;
  if (m <= t[0]) return t[1];
  if (m >= t[2 * (n - 1)]) return t[2 * n - 1];
  let lo = 0, hi = n - 1;
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (t[2 * mid] <= m) lo = mid; else hi = mid; }
  const m0 = t[2 * lo], c0 = t[2 * lo + 1], m1 = t[2 * hi], c1 = t[2 * hi + 1];
  return c0 + (c1 - c0) * (m - m0) / (m1 - m0);
}

// ---------- Atmosphere ----------
function density(tC, pHpa, hum) {
  const tK = tC + 273.15;
  const es = 610.78 * Math.exp(17.27 * tC / (tC + 237.3));
  const pv = Math.min(Math.max(hum, 0), 100) / 100 * es;
  return (pHpa * 100 - pv) / (287.058 * tK) + pv / (461.495 * tK);
}
const speedOfSound = tC => 20.0468 * Math.sqrt(tC + 273.15);
const pressureAtAltitude = m => 1013.25 * Math.pow(1 - 2.25577e-5 * m, 5.25588);

// ---------- Solver: RK4 point mass in the line-of-sight frame (x downrange, y up, z right) ----------
function makeSolver(p) {
  const bcSi = p.bc * 703.0696, sightH = p.sightHeightMm / 1000, massKg = p.bulletGr * 6.479891e-5;
  const table = p.model === "G1" ? G1 : G7;
  const mvAt = tC => p.mv + (tC - p.mvTempC) * p.mvSens;

  function integrate(bore, s, mv, ranges) {
    const c = speedOfSound(s.temp), k0 = density(s.temp, s.pressure, s.humidity) * Math.PI / (8 * bcSi);
    const th = s.angle * Math.PI / 180, gx = -9.80665 * Math.sin(th), gy = -9.80665 * Math.cos(th);
    const wa = s.windClock * Math.PI / 6, wx = -s.windSpeed * Math.cos(wa), wz = -s.windSpeed * Math.sin(wa);
    const om = 7.292115e-5, lat = s.latitude * Math.PI / 180, az = s.azimuth * Math.PI / 180;
    const ox = om * Math.cos(lat) * Math.cos(az), oy = om * Math.sin(lat), oz = -om * Math.cos(lat) * Math.sin(az);
    const cor = !!s.coriolis;
    const a = new Float64Array(3);
    function acc(vx, vy, vz) {
      const rx = vx - wx, rz = vz - wz, sp = Math.sqrt(rx * rx + vy * vy + rz * rz);
      const k = k0 * cd(table, sp / c) * sp;
      let ax = -k * rx + gx, ay = -k * vy + gy, azz = -k * rz;
      if (cor) { ax -= 2 * (oy * vz - oz * vy); ay -= 2 * (oz * vx - ox * vz); azz -= 2 * (ox * vy - oy * vx); }
      a[0] = ax; a[1] = ay; a[2] = azz;
    }
    const out = new Array(ranges.length).fill(null);
    let x = 0, y = -sightH, z = 0, vx = mv * Math.cos(bore), vy = mv * Math.sin(bore), vz = 0, t = 0, idx = 0;
    while (idx < ranges.length && ranges[idx] <= 0) { out[idx] = [0, y, z, mv, 0]; idx++; }
    const dt = 0.0005;
    while (idx < ranges.length && t < 20 && vx > 30) {
      acc(vx, vy, vz); const a1x = a[0], a1y = a[1], a1z = a[2];
      const v2x = vx + a1x * dt / 2, v2y = vy + a1y * dt / 2, v2z = vz + a1z * dt / 2;
      acc(v2x, v2y, v2z); const a2x = a[0], a2y = a[1], a2z = a[2];
      const v3x = vx + a2x * dt / 2, v3y = vy + a2y * dt / 2, v3z = vz + a2z * dt / 2;
      acc(v3x, v3y, v3z); const a3x = a[0], a3y = a[1], a3z = a[2];
      const v4x = vx + a3x * dt, v4y = vy + a3y * dt, v4z = vz + a3z * dt;
      acc(v4x, v4y, v4z); const a4x = a[0], a4y = a[1], a4z = a[2];
      const nx = x + dt / 6 * (vx + 2 * v2x + 2 * v3x + v4x);
      const ny = y + dt / 6 * (vy + 2 * v2y + 2 * v3y + v4y);
      const nz = z + dt / 6 * (vz + 2 * v2z + 2 * v3z + v4z);
      const nvx = vx + dt / 6 * (a1x + 2 * a2x + 2 * a3x + a4x);
      const nvy = vy + dt / 6 * (a1y + 2 * a2y + 2 * a3y + a4y);
      const nvz = vz + dt / 6 * (a1z + 2 * a2z + 2 * a3z + a4z);
      while (idx < ranges.length && nx >= ranges[idx]) {
        const f = (ranges[idx] - x) / (nx - x);
        const s0 = Math.hypot(vx, vy, vz), s1 = Math.hypot(nvx, nvy, nvz);
        out[idx] = [ranges[idx], y + f * (ny - y), z + f * (nz - z), s0 + f * (s1 - s0), t + f * dt];
        idx++;
      }
      x = nx; y = ny; z = nz; vx = nvx; vy = nvy; vz = nvz; t += dt;
    }
    return out;
  }

  let bore = null;
  function boreAngle() {
    if (bore !== null) return bore;
    bore = 0;
    if (p.zeroM <= 0) return bore;
    const s = { temp: p.zeroTempC, pressure: p.zeroPressureHpa, humidity: 50, angle: 0, windSpeed: 0, windClock: 3, latitude: 0, azimuth: 0, coriolis: false };
    const mv = mvAt(p.zeroTempC);
    let ang = sightH / p.zeroM;
    for (let i = 0; i < 30; i++) {
      const r = integrate(ang, s, mv, [p.zeroM])[0];
      if (!r) break;
      if (Math.abs(r[1]) < 1e-6) break;
      ang -= r[1] / p.zeroM;
    }
    return (bore = ang);
  }

  // Miller stability, corrected for velocity and air; 0 when bullet length or twist is unknown.
  function stability(s) {
    if (!(p.twistIn > 0 && p.bulletLenMm > 0 && p.caliberMm > 0 && p.bulletGr > 0)) return 0;
    const d = p.caliberMm / 25.4, l = p.bulletLenMm / 25.4 / d, tw = p.twistIn / d;
    let sg = 30 * p.bulletGr / (tw * tw * d * d * d * l * (1 + l * l));
    sg *= Math.cbrt(mvAt(s.temp) / FT / 2800);
    const tF = s.temp * 9 / 5 + 32;
    sg *= (tF + 460) / (59 + 460) * 29.92 / (s.pressure * 0.02953);
    return sg;
  }

  const solve = (s, ranges) => solveWithBore(boreAngle(), s, ranges);
  // Like solve, but with the bore at `bore` radians above the line of sight instead of the zeroed angle.
  function solveWithBore(bore, s, ranges) {
    const raw = integrate(bore, s, mvAt(s.temp), ranges);
    const sg = stability(s), c = speedOfSound(s.temp), dir = p.rightTwist ? 1 : -1;
    return raw.map(r => {
      if (!r) return null;
      const [x, y, z, v, t] = r;
      const sd = sg > 0 ? dir * 1.25 * (sg + 1.2) * Math.pow(t, 1.83) * INCH : 0;
      const zz = z + sd, lead = s.targetSpeed * t;
      return {
        range: x, y, z: zz, spin: sd, v, energy: 0.5 * massKg * v * v, tof: t, mach: v / c, lead,
        elevMil: x > 0 ? Math.atan2(-y, x) * 1000 : 0,
        windMil: x > 0 ? Math.atan2(-zz, x) * 1000 : 0,
        leadMil: x > 0 ? Math.atan2(lead, x) * 1000 : 0,
      };
    });
  }
  return { solve, solveWithBore, stability, mvAt };
}

// ---------- Maximum point blank range ----------
// The zero that keeps the bullet within ±group/2 of the aim point for the longest distance.
// Flat shot, no wind. Distances in metres (heights sampled every metre), heights in metres.
function computeMpbr(p, s, groupIn) {
  if (!(groupIn > 0)) return null;
  const h = groupIn * INCH / 2, sv = makeSolver(p);
  const flat = { ...s, angle: 0, windSpeed: 0, targetSpeed: 0, coriolis: false };
  const ranges = Array.from({ length: 1501 }, (_, i) => i);
  const path = b => sv.solveWithBore(b, flat, ranges).map(pt => pt ? pt.y : NaN);
  const peak = y => y.reduce((m, v) => Number.isNaN(v) ? m : Math.max(m, v), -Infinity);
  // Peak height rises with bore angle, so bisect for the angle whose peak is exactly +h.
  let lo = 0, hi = 0.03;
  if (peak(path(hi)) < h) return null;
  for (let i = 0; i < 40; i++) { const mid = (lo + hi) / 2; if (peak(path(mid)) < h) lo = mid; else hi = mid; }
  const y = path((lo + hi) / 2);
  let last = y.length - 1;
  while (last >= 0 && Number.isNaN(y[last])) last--;
  if (last < 2) return null;
  let ip = 0;
  for (let i = 0; i <= last; i++) if (y[i] > y[ip]) ip = i;
  const cross = (from, to, level, rising) => {
    for (let i = Math.max(from, 1); i <= to; i++) {
      const a = y[i - 1], b = y[i];
      if (rising ? (a < level && b >= level) : (a > level && b <= level)) return (i - 1) + (level - a) / (b - a);
    }
    return NaN;
  };
  return {
    h, peak: ip, heights: y.slice(0, last + 1),
    nearZero: cross(1, ip, 0, true), farZero: cross(ip + 1, last, 0, false),
    mpbr: cross(ip + 1, last, -h, false), enters: y[0] >= -h ? 0 : cross(1, ip, -h, true),
  };
}

// State-bound numeric field: stores `value * scale` under `key` and calls `after`.
function bindState(id, key, scale, after) { bindNum(id, v => { state[key] = v * scale; save(); after && after(); }); }

function bindCommon(rerender, onRange) {

  const pts = makeSolver(p).solve(shot(), ranges);
  document.getElementById("thead").innerHTML =
    `<tr><th>${dName()}</th><th>Elev ${u}</th><th>Clk</th><th>Wind ${u}</th><th>Clk</th><th>fps</th><th>${state.yards ? "ft·lb" : "J"}</th><th>s</th></tr>`;
  document.getElementById("tbody").innerHTML = pts.filter(Boolean).map(pt => {
    const w = pt.windMil + pt.leadMil;
    return `<tr class="${pt.mach < 1.2 ? "trans" : ""}"><td>${f0(dist(pt.range))}</td><td>${f2(corr(p, pt.elevMil))}</td><td>${clicks(p, pt.elevMil)}</td>
      <td>${lr(corr(p, w))}</td><td>${lr(clicks(p, w), 0)}</td><td>${f0(pt.v / FT)}</td><td>${f0(state.yards ? pt.energy * FTLB : pt.energy)}</td><td>${f2(pt.tof)}</td></tr>`;
  }).join("") || `<tr><td colspan="8" style="text-align:left">No ranges to show. Check start, end and step.</td></tr>`;
}

// ---------- MPBR ----------
let lastMpbr = null;
function renderMpbr() {
  main.innerHTML = `
    ${rifleSelect()}
    ${unitsPanel(false)}
    <h2>Group size</h2>
    <div class="panel">${field("grp", "Group / vital zone", r1(state.mpbrGroup), { unit: "in", hint: "e.g. 4 = ±2 in of your aim" })}</div>
    <section class="readout" id="mres" aria-live="polite"></section>
    <canvas class="chart" id="mchart" aria-label="Bullet path against the point of aim"></canvas>
    <p class="note">Orange line: bullet path. Dashed line: point of aim. Shaded band: your group size, centred on the point of aim.</p>
    <button type="button" class="primary" id="mset">Set this as the rifle's zero</button>
    <p class="note" id="mmsg" hidden></p>`;
  bindCommon(renderMpbr, updateMpbr);
  bindState("grp", "mpbrGroup", 1, updateMpbr);
  document.getElementById("mset").addEventListener("click", () => {
    const m = lastMpbr;
    if (!m) return;
    const p = selected(), s = shot();
    p.zeroYards = state.yards;
    p.zeroM = Math.round(dist(m.farZero)) * du();
    p.zeroTempC = s.temp;
    p.zeroPressureHpa = s.pressure;
    save();
    const msg = document.getElementById("mmsg");
    msg.hidden = false;
    msg.textContent = `${p.name} is now zeroed at ${zeroText(p)}. The Solve and Table tabs use this zero.`;
  });
  updateMpbr();
}

function updateMpbr() {
  const box = document.getElementById("mres");
  if (!box) return;
  const p = selected(), group = state.mpbrGroup;
  const m = computeMpbr(p, shot(), group);
  const ok = m && !Number.isNaN(m.farZero) && !Number.isNaN(m.mpbr);
  lastMpbr = ok ? m : null;
  document.getElementById("mset").disabled = !ok;
  if (!ok) {
    box.innerHTML = `<div class="oor">No solution</div><p class="note">Enter a group size greater than 0. If it already is, this load may not reach that height within ${f0(dist(1500))} ${dName()}.</p>`;
    drawMpbrChart(null);
    return;
  }
  const half = group / 2, dn = dName();
  const at100 = m.heights[Math.round(100 * du())];
  box.innerHTML = `
    <div class="mz">Zero at ${f0(dist(m.farZero))} ${dn}</div>
    <div class="mp">Point blank to ${f0(dist(m.mpbr))} ${dn}</div>
    <dl class="facts">
      <div><dt>Aim dead on</dt><dd>${f0(dist(m.enters))}–${f0(dist(m.mpbr))} ${dn}</dd></div>
      <div><dt>Stays within</dt><dd>±${r1(half)} in</dd></div>
      <div><dt>Peak</dt><dd>+${r1(half)} in @ ${f0(dist(m.peak))} ${dn}</dd></div>
      <div><dt>Crosses aim</dt><dd>${f0(dist(m.nearZero))} &amp; ${f0(dist(m.farZero))} ${dn}</dd></div>
      ${at100 !== undefined ? `<div><dt>Sight-in at 100 ${dn}</dt><dd>${f1(Math.abs(at100 / INCH))} in ${at100 >= 0 ? "high" : "low"}</dd></div>` : ""}
      <div><dt>Conditions</dt><dd>Solve tab air, flat, no wind</dd></div>
    </dl>`;
  drawMpbrChart(m);
}

function drawMpbrChart(m) {
  const cv = document.getElementById("mchart");
  if (!cv) return;
  const W = cv.clientWidth || 320, H = Math.round(W * 0.72), dpr = window.devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const css = getComputedStyle(document.documentElement);
  const tok = n => css.getPropertyValue(n).trim();
  g.fillStyle = tok("--panel"); g.fillRect(0, 0, W, H);
  if (!m) return;
  const half = state.mpbrGroup / 2;
  const end = Math.min(m.heights.length - 1, Math.floor(m.mpbr * 1.2 + 10));
  const xs = [], ys = [];
  for (let i = 0; i <= end; i++) { xs.push(dist(i)); ys.push(m.heights[i] / INCH); }
  const xMax = xs[xs.length - 1];
  const yTop = half * 2, yBot = Math.min(-half * 1.6, Math.max(Math.min(...ys), -half * 4));
  const padL = 34, padR = 10, padT = 24, padB = 26;
  const px = x => padL + x / xMax * (W - padL - padR);
  const py = y => padT + (yTop - y) / (yTop - yBot) * (H - padT - padB);
  const nice = raw => { const p10 = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p10; return p10 * (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10); };
  const lbl = v => (Math.abs(v - Math.round(v)) < 1e-6 ? String(Math.round(v)) : v.toFixed(1));
  const numFont = tok("--num") || "monospace";
  g.font = `10.5px ${numFont}`;
  g.lineWidth = 1;
  // Grid and axis labels
  const xs5 = nice(xMax / 5);
  for (let x = 0; x <= xMax + 1e-9; x += xs5) {
    g.strokeStyle = tok("--line"); g.beginPath(); g.moveTo(px(x), padT); g.lineTo(px(x), H - padB); g.stroke();
    g.fillStyle = tok("--muted"); const t = lbl(x); g.fillText(t, px(x) - g.measureText(t).width / 2, H - padB + 14);
  }
  g.fillText(dName(), W - padR - g.measureText(dName()).width, H - 3);
  const ys6 = nice((yTop - yBot) / 6);
  for (let y = Math.ceil(yBot / ys6) * ys6; y <= yTop + 1e-9; y += ys6) {
    g.strokeStyle = tok("--line"); g.beginPath(); g.moveTo(padL, py(y)); g.lineTo(W - padR, py(y)); g.stroke();
    g.fillStyle = tok("--muted"); const t = (y > 0 ? "+" : "") + lbl(y); g.fillText(t, padL - 4 - g.measureText(t).width, py(y) + 4);
  }
  g.fillText("in", 4, padT - 9);
  // Group band, its edges and the point of aim
  const accent = tok("--accent");
  g.globalAlpha = 0.18; g.fillStyle = accent; g.fillRect(padL, py(half), W - padL - padR, py(-half) - py(half)); g.globalAlpha = 1;
  g.setLineDash([6, 4]); g.strokeStyle = accent; g.lineWidth = 1.2;
  for (const y of [half, -half]) { g.beginPath(); g.moveTo(padL, py(y)); g.lineTo(W - padR, py(y)); g.stroke(); }
  g.setLineDash([3, 3]); g.strokeStyle = tok("--fg"); g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(padL, py(0)); g.lineTo(W - padR, py(0)); g.stroke();
  g.setLineDash([]);
  // Markers
  g.font = `600 10.5px ${tok("--body") || "sans-serif"}`;
  let lastRight = -1, row = 0;
  for (const [x, name] of [[dist(m.peak), "Peak"], [dist(m.farZero), "Zero"], [dist(m.mpbr), "MPBR"]].sort((a, b) => a[0] - b[0])) {
    if (!(x <= xMax)) continue;
    g.strokeStyle = tok("--muted"); g.lineWidth = 1; g.beginPath(); g.moveTo(px(x), padT); g.lineTo(px(x), H - padB); g.stroke();
    const tw = g.measureText(name).width, left = Math.min(Math.max(px(x) - tw / 2, 0), W - tw);
    row = left < lastRight + 4 ? 1 - row : 0;
    g.fillStyle = tok("--fg"); g.fillText(name, left, padT - 10 + row * 11);
    lastRight = left + tw;
  }
  // Bullet path, clipped to the plot
  g.save(); g.beginPath(); g.rect(padL, padT, W - padL - padR, H - padT - padB); g.clip();
  g.strokeStyle = accent; g.lineWidth = 2.6; g.lineJoin = "round";
  g.beginPath();
  let started = false;
  for (let i = 0; i < xs.length; i++) {
    if (Number.isNaN(ys[i])) continue;
    if (!started) { g.moveTo(px(xs[i]), py(ys[i])); started = true; } else g.lineTo(px(xs[i]), py(ys[i]));
  }
  g.stroke(); g.restore();
}

// ---------- Rifles ----------
let editing = null;      // { draft, isNew }
let armedDelete = null;  // profile id awaiting a second tap
function renderRifles() {
  if (editing) return renderEditor();
  main.innerHTML = `
    <h2>Rifle profiles</h2>
    ${state.profiles.map(p => `
      <article class="rifle${p.id === selected().id ? " sel" : ""}">
        <h3>${esc(p.name)}${p.id === selected().id ? '<span class="tag">In use</span>' : ""}</h3>
        <p>${p.bulletGr} gr · ${p.model} ${f3(p.bc)} · ${f0(p.mv / FT)} fps · zero ${zeroText(p)} · ${p.clickValue} ${p.clickUnit}/click</p>
        <div class="btns">
          <button type="button" data-act="use" data-id="${p.id}">Use</button>
          <button type="button" data-act="edit" data-id="${p.id}">Edit</button>
          <button type="button" data-act="copy" data-id="${p.id}">Copy</button>
          <button type="button" class="danger" data-act="del" data-id="${p.id}" ${state.profiles.length === 1 ? "disabled" : ""}>${armedDelete === p.id ? "Tap to confirm" : "Delete"}</button>
        </div>
      </article>`).join("")}
    <div class="btns">
      <button type="button" class="primary" id="addFactory">Add from factory ammo</button>
      <button type="button" id="addOwn">Add with your own data</button>
    </div>
    <p class="note">Example profiles are starting points. Enter your own chronographed velocity and the maker's BC, then confirm drops on paper at distance. Profiles are saved on this device only.</p>`;
  main.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => {
    const id = Number(b.dataset.id), p = state.profiles.find(x => x.id === id);
    const act = b.dataset.act;
    if (act !== "del") armedDelete = null;
    if (act === "use") { state.selected = id; save(); show("solve"); return; }
    if (act === "edit") { editing = { draft: { ...p }, isNew: false }; renderRifles(); return; }
    if (act === "copy") { state.profiles.push({ ...p, id: Date.now(), name: p.name + " (copy)" }); save(); renderRifles(); return; }
    if (act === "del") {
      if (armedDelete !== id) { armedDelete = id; renderRifles(); return; }
      state.profiles = state.profiles.filter(x => x.id !== id); armedDelete = null;
      if (state.selected === id) state.selected = state.profiles[0].id;
      save(); renderRifles();
    }
  }));
  document.getElementById("addOwn").addEventListener("click", () => { editing = { draft: newProfile(), isNew: true }; renderRifles(); });
  document.getElementById("addFactory").addEventListener("click", () => openPicker(a => {
    editing = { draft: applyAmmo(newProfile(), a, true), isNew: true }; renderRifles();
  }));
}
function newProfile() {
  return { ...DEFAULT_PROFILES[0], id: Date.now(), name: "New rifle", zeroYards: state.yards, zeroM: 100 * du(), bulletLenMm: 0 };
}
function applyAmmo(d, a, rename) {
  Object.assign(d, { caliberMm: a.dia, bulletGr: a.gr, bulletLenMm: a.len, bc: a.bc, model: a.model, mv: a.mv });
  if (rename) d.name = `${a.cal} ${ammoLabel(a)}`;
  return d;
}

const EDIT_FIELDS = [
  // [id, label, get, set, unit, signed]
  ["e_cal", "Caliber", d => d.caliberMm, (d, v) => d.caliberMm = v, "mm"],
  ["e_gr", "Bullet weight", d => d.bulletGr, (d, v) => d.bulletGr = v, "gr"],
  ["e_len", "Bullet length", d => d.bulletLenMm, (d, v) => d.bulletLenMm = v, "mm"],
  ["e_bc", "Ballistic coefficient", d => d.bc, (d, v) => d.bc = v, ""],
  ["e_mv", "Muzzle velocity", d => Math.round(d.mv / FT), (d, v) => d.mv = v * FT, "fps"],
  ["e_mvt", "MV measured at", d => d.mvTempC, (d, v) => d.mvTempC = v, "°C", true],
  ["e_sens", "Temp sensitivity", d => Math.round(d.mvSens / FT * 10) / 10, (d, v) => d.mvSens = v * FT, "fps/°C", true],
  ["e_tw", "Barrel twist (1 in …)", d => d.twistIn, (d, v) => d.twistIn = v, "in"],
  ["e_sh", "Sight height", d => d.sightHeightMm, (d, v) => d.sightHeightMm = v, "mm"],
  ["e_click", "Click value", d => d.clickValue, (d, v) => d.clickValue = v, ""],
  ["e_zero", "Zero distance", d => Math.round(d.zeroM / (d.zeroYards ? YD : 1) * 10) / 10, (d, v) => d.zeroM = v * (d.zeroYards ? YD : 1), ""],
  ["e_zt", "Zero temperature", d => d.zeroTempC, (d, v) => d.zeroTempC = v, "°C", true],
  ["e_zp", "Zero pressure", d => d.zeroPressureHpa, (d, v) => d.zeroPressureHpa = v, "hPa"],
];
function renderEditor() {
  const d = editing.draft;
  const F = id => { const f = EDIT_FIELDS.find(x => x[0] === id); return field(f[0], f[1], r1(f[2](d)).replace(/^NaN$/, ""), { unit: id === "e_zero" ? (d.zeroYards ? "yd" : "m") : f[4], signed: !!f[5] }); };
  main.innerHTML = `
    <h2>${editing.isNew ? "New rifle" : "Edit rifle"}</h2>
    <div class="panel"><div class="row"><label for="e_name">Name</label></div>
      <div style="padding-bottom:12px"><input type="text" class="wide" id="e_name" value="${esc(d.name)}" autocomplete="off"></div></div>
    <button type="button" id="fillFactory">Fill bullet and velocity from factory ammo</button>
    <h2>Bullet</h2>
    <div class="panel">${F("e_cal")}${F("e_gr")}${F("e_len")}${F("e_bc")}${segRow("Drag model", "e_model", [["G1", "G1"], ["G7", "G7"]], d.model)}</div>
    <h2>Velocity</h2>
    <div class="panel">${F("e_mv")}${F("e_mvt")}${F("e_sens")}</div>
    <h2>Rifle and scope</h2>
    <div class="panel">${F("e_tw")}${segRow("Twist direction", "e_twist", [[1, "Right"], [0, "Left"]], d.rightTwist ? 1 : 0)}${F("e_sh")}
      ${segRow("Scope unit", "e_unit", [["MIL", "MIL"], ["MOA", "MOA"]], d.clickUnit)}${F("e_click")}</div>
    <h2>Zero</h2>
    <div class="panel">${segRow("Zero distance in", "e_zu", [[0, "Metres"], [1, "Yards"]], d.zeroYards ? 1 : 0)}${F("e_zero")}${F("e_zt")}${F("e_zp")}</div>
    <p class="note">Factory figures are the maker's published BC and box velocity. Check them against your box. A bullet length of 0 means unknown; measure a bullet and enter it to get stability and spin drift.</p>
    <p class="note warn" id="e_err" hidden></p>
    <div class="btns"><button type="button" class="primary" id="e_save">Save rifle</button><button type="button" id="e_cancel">Cancel</button></div>`;
  const readAll = () => {
    d.name = document.getElementById("e_name").value.trim() || "Rifle";
    const bad = [];
    for (const f of EDIT_FIELDS) { const v = num(document.getElementById(f[0]).value); if (v === null) bad.push(f[1]); else f[3](d, v); }
    return bad;
  };
  main.querySelectorAll("[data-seg]").forEach(b => b.addEventListener("click", () => {
    readAll();
    const v = b.dataset.val;
    if (b.dataset.seg === "e_model") d.model = v;
    if (b.dataset.seg === "e_twist") d.rightTwist = v === "1";
    if (b.dataset.seg === "e_unit") d.clickUnit = v;
    if (b.dataset.seg === "e_zu") d.zeroYards = v === "1";
    renderEditor();
  }));
  bindNegs(main);
  document.getElementById("fillFactory").addEventListener("click", () => {
    readAll();
    openPicker(a => { applyAmmo(d, a, d.name === "New rifle" || !d.name); renderEditor(); });
  });
  document.getElementById("e_cancel").addEventListener("click", () => { editing = null; renderRifles(); });
  document.getElementById("e_save").addEventListener("click", () => {
    const bad = readAll(), err = document.getElementById("e_err");
    if (bad.length || !(d.bc > 0) || !(d.mv > 0)) {
      err.hidden = false;
      err.textContent = bad.length ? `Enter a number for: ${bad.join(", ")}.` : "Ballistic coefficient and muzzle velocity must be greater than 0.";
      return;
    }
    if (editing.isNew) { state.profiles.push(d); state.selected = d.id; }
    else state.profiles = state.profiles.map(p => p.id === d.id ? d : p);
    save(); editing = null; renderRifles();
  });
}

// ---------- Factory ammo picker ----------
function openPicker(onPick) {
  const sheet = document.getElementById("sheet");
  sheet.innerHTML = `<div class="sheet" id="sheetBg"><div class="box" role="dialog" aria-modal="true" aria-label="Factory ammo">
    <div class="head"><h2>Factory ammo · ${AMMO.length} loads</h2><button type="button" class="ghost" id="pClose">Close</button></div>
    <select id="pCal" class="wide"><option value="">All calibers</option>${CALIBERS.map(c => `<option>${esc(c)}</option>`).join("")}</select>
    <input type="text" class="wide" id="pQ" placeholder="Search, e.g. 150 SST or Precision Hunter" autocomplete="off">
    <div class="list" id="pList"></div></div></div>`;
  const list = document.getElementById("pList"), cal = document.getElementById("pCal"), q = document.getElementById("pQ");
  const close = () => { sheet.innerHTML = ""; };
  const draw = () => {
    const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
    const hits = AMMO.filter(a => (!cal.value || a.cal === cal.value) &&
      words.every(w => `${a.cal} ${a.brand} ${a.bullet} ${a.gr}gr ${a.gr} ${a.item}`.toLowerCase().includes(w)));
    list.innerHTML = hits.slice(0, 120).map(a => `<button type="button" class="load" data-i="${AMMO.indexOf(a)}">${esc(ammoLabel(a))}
      <span>${esc(a.cal)} · ${a.model} ${f3(a.bc)} · ${f0(a.mv / FT)} fps${a.item ? " · #" + a.item : ""}</span></button>`).join("")
      + (hits.length > 120 ? `<p class="note">${hits.length - 120} more. Pick a caliber or refine the search.</p>` : "")
      + (hits.length ? "" : `<p class="note">No loads match. Try fewer words.</p>`);
  };
  cal.addEventListener("change", draw);
  q.addEventListener("input", draw);
  list.addEventListener("click", e => { const b = e.target.closest("[data-i]"); if (b) { close(); onPick(AMMO[Number(b.dataset.i)]); } });
  document.getElementById("pClose").addEventListener("click", close);
  document.getElementById("sheetBg").addEventListener("click", e => { if (e.target.id === "sheetBg") close(); });
  const cur = selected();
  const guess = AMMO.find(a => Math.abs(a.dia - cur.caliberMm) < 0.02);
  if (guess) cal.value = guess.cal;
  draw();
}

// ---------- Tabs ----------
const VIEWS = { solve: renderSolve, table: renderTable, mpbr: renderMpbr, rifles: renderRifles };
function show(tab) {
  if (!VIEWS[tab]) tab = "solve";
  state.tab = tab; save();
  if (tab !== "rifles") { editing = null; armedDelete = null; }
  document.querySelectorAll("nav.tabs button").forEach(b => { if (b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  VIEWS[tab]();
  window.scrollTo(0, 0);
}
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => show(b.dataset.tab)));
window.addEventListener("resize", () => { if (state.tab === "mpbr") drawMpbrChart(lastMpbr); });
show(state.tab);
</script>

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
